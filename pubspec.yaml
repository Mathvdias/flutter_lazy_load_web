name: flutter_lazy_load_web
description: >-
  Flutter widget for deferred (lazy) library loading on web — splits JS bundles
  on demand with zero external dependencies.
version: 0.1.3
homepage: https://github.com/Mathvdias/flutter_lazy_load_web
repository: https://github.com/Mathvdias/flutter_lazy_load_web
issue_tracker: https://github.com/Mathvdias/flutter_lazy_load_web/issues

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
