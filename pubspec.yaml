name: flutter_lazy_load_web
description: >-
  A Flutter widget that wraps Dart deferred (lazy) library loading for web apps.
  Splits your app into on-demand chunks, dramatically reducing the initial JS
  bundle size and improving time-to-interactive — with zero external dependencies.
version: 0.1.1
homepage: https://github.com/Mathvdias/flutter_lazy_load_web
repository: https://github.com/Mathvdias/flutter_lazy_load_web
issue_tracker: https://github.com/Mathvdias/flutter_lazy_load_web/issues

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: '>=3.16.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
